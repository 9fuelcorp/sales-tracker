<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9th Fuel Hub Corporation — Station Ledger</title>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">

<!-- Link preview (Messenger / Facebook / etc.) -->
<meta property="og:title" content="9th Fuel Hub Corporation — Station Ledger">
<meta property="og:description" content="Cash, fuel, and receivables tracking system.">
<meta property="og:image" content="og-image.png">
<meta property="og:type" content="website">

<!-- PWA: makes "Add to Home Screen" open full-screen like a real app -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14206b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Station Ledger">

<style>
  :root {
    --ink: #12204a;
    --paper: #f7f8fa;
    --line: #d7dbe4;
    --navy: #14206b;
    --navy-dark: #0c1547;
    --accent: #2e8f3f;
    --accent-dark: #1f6b2c;
    --danger: #a83e3e;
    --danger-bg: #fbeeee;
    --ok-bg: #eaf3ee;
    --muted: #5c6478;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  h1, h2, h3 { font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-size: 1.4rem; margin: 0; }
  h2 { font-size: 1.1rem; margin: 28px 0 10px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* Top bar */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 16px; border-bottom: 3px solid var(--navy); margin-bottom: 20px;
  }
  .topbar .who { font-size: 0.85rem; color: var(--muted); }
  .btn {
    background: var(--accent); color: white; border: none; border-radius: 6px;
    padding: 10px 16px; font-size: 0.95rem; cursor: pointer; font-family: var(--sans);
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: var(--danger); }
  .btn.small { padding: 6px 10px; font-size: 0.82rem; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Login */
  .login-box {
    max-width: 340px; margin: 15vh auto 0; background: white; border: 1px solid var(--line);
    border-top: 4px solid var(--navy); border-radius: 10px; padding: 32px;
  }
  .login-box h1 { text-align: center; margin-bottom: 4px; color: var(--navy); }
  .login-box p.sub { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin: 14px 0 4px; }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 1rem; font-family: var(--sans); background: white;
  }
  input[type=password] { letter-spacing: 0.2em; }
  .error { color: var(--danger); font-size: 0.85rem; margin-top: 10px; }

  /* Cards */
  .card {
    background: white; border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  .stat { text-align: left; }
  .stat .label { font-size: 0.78rem; color: var(--muted); }
  .stat .value { font-size: 1.5rem; font-weight: 700; }

  .line-item {
    display: flex; gap: 8px; margin-bottom: 8px; align-items: center;
  }
  .line-item select { flex: 1.4; }
  .line-item input { flex: 1; }
  .remove-line { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.1rem; }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tr.flagged { background: var(--danger-bg); }

  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .tab { padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-size: 0.92rem; }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

  .review-box { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 16px; }
  .review-row { display: flex; justify-content: space-between; padding: 4px 0; }
  .review-row.total { font-weight: 700; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
  .match { color: var(--accent); }
  .mismatch { color: var(--danger); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
  .badge.ok { background: var(--ok-bg); color: var(--accent-dark); }
  .badge.flag { background: var(--danger-bg); color: var(--danger); }

  .hidden { display: none !important; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.between { justify-content: space-between; }
  .muted { color: var(--muted); font-size: 0.85rem; }

  .success-banner {
    background: var(--ok-bg); color: var(--accent-dark); border: 1px solid var(--accent);
    border-radius: 8px; padding: 14px 18px; margin-bottom: 18px; font-weight: 600;
    display: flex; align-items: center; gap: 8px; animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .loading-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 70vh; gap: 18px; text-align: center;
  }
  .loading-spinner {
    width: 48px; height: 48px; border-radius: 50%;
    border: 4px solid var(--line); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  .loading-text {
    font-weight: 700; font-size: 1.05rem; color: var(--navy);
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  @media print {
    @page { size: A4; margin: 1.5cm; }
    body * { visibility: hidden; }
    #printableReport, #printableReport * { visibility: visible; }
    #printableReport { position: absolute; left: 0; top: 0; width: 100%; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>

<div id="app" class="wrap">
  <div class="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading…</div>
  </div>
</div>

<script>
/* ====================================================================
   CONFIG — paste your deployed Google Apps Script Web App URL below
   ==================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbyYz28Hb3pDnvpFxI0WSDChGsrS0QKdWqulvGktpVL6o_yvEVP7yE5cnrPdN9c9UT1BUw/exec";

/* ==================== API helper ====================
   Uses text/plain content-type on purpose — this avoids a CORS
   "preflight" request that Google Apps Script cannot handle. */
async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}

/* ==================== State ==================== */
let state = {
  user: JSON.parse(localStorage.getItem('stationUser') || 'null'),
  stations: [],
  categories: [],
  expenseLines: [],
  deliveryLines: [],
  cashSalesLines: [],
  cardSalesLines: [],
  checkLines: []
};

const peso = n => '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
}
function formatDateTime(tsStr) {
  if (!tsStr) return '';
  const d = new Date(tsStr);
  if (isNaN(d)) return tsStr;
  return d.toLocaleString('en-PH', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
// Always shows the exact time an entry was submitted, alongside the date the
// manager recorded — gives a full audit trail of when data actually came in,
// not just what date it was logged under.
function submittedNote(recordedDateStr, timestampStr) {
  if (!timestampStr) return '';
  return `<br><span class="muted" style="font-size:0.78em;">submitted ${formatDateTime(timestampStr)}</span>`;
}

// Reads an image file, resizes it down (keeps uploads small and fast), and
// returns a base64 data URL. Used for both profile photos and receipt photos.
function compressImageFile(file, maxDim) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height *= maxDim / width; width = maxDim; }
        else if (height > maxDim) { width *= maxDim / height; height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
const app = document.getElementById('app');

function loadingScreenHtml(message) {
  return `<div class="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">${message || 'Loading…'}</div>
  </div>`;
}

function logout() {
  localStorage.removeItem('stationUser');
  state.user = null;
  render();
}

/* ==================== Auto-logout on inactivity ==================== */
const INACTIVITY_LIMIT_MS = 15 * 60 * 1000; // 15 minutes — adjust here if needed
let inactivityTimer = null;

function resetInactivityTimer() {
  if (!state.user) return; // nothing to log out of
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    if (state.user) {
      logout();
      alert('You were logged out after 15 minutes of inactivity.');
    }
  }, INACTIVITY_LIMIT_MS);
}

['mousedown', 'mousemove', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt =>
  document.addEventListener(evt, resetInactivityTimer, { passive: true })
);

/* ==================== Render router ==================== */
async function render() {
  if (!state.user) return renderLogin();
  resetInactivityTimer();
  if (state.user.role === 'owner') return renderOwner();
  if (state.user.role === 'viewer') return renderOwner(); // viewer reuses owner screens in read-only mode
  return renderManager();
}

function isOwnerRole() { return state.user && state.user.role === 'owner'; }

/* ==================== LOGIN ==================== */
function renderLogin() {
  app.innerHTML = `
    <div class="login-box">
      <img src="logo.png" alt="9th Fuel Hub Corporation" style="width:100%; max-width:220px; display:block; margin:0 auto 16px;">
      <h1>Station Ledger</h1>
      <p class="sub">Enter your Employee ID and PIN</p>
      <label>Employee ID</label>
      <input id="employeeId" autocomplete="off" placeholder="e.g. MGR1">
      <label>6-Digit PIN</label>
      <input id="pin" type="password" maxlength="6" inputmode="numeric" placeholder="••••••">
      <button class="btn" style="width:100%; margin-top:20px;" onclick="doLogin()">Log In</button>
      <div id="loginError" class="error"></div>
    </div>
  `;
}

async function doLogin() {
  const employeeId = document.getElementById('employeeId').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if (!employeeId || !pin) { errEl.textContent = 'Enter both fields.'; return; }
  try {
    const res = await api('login', { employeeId, pin });
    if (!res.success) { errEl.textContent = res.error || 'Login failed.'; return; }
    state.user = res.user;
    localStorage.setItem('stationUser', JSON.stringify(res.user));
    render();
  } catch (e) {
    errEl.textContent = 'Could not reach the server. Check the API_URL setup.';
  }
}

/* ==================== Shared: load stations + categories ==================== */
async function loadRefData() {
  const [s, c] = await Promise.all([api('getStations', {}), api('getCategories', {})]);
  state.stations = s.stations || [];
  state.categories = c.categories || [];
}

function stationName(id) {
  const s = state.stations.find(x => x.StationID === id);
  return s ? s.StationName : id;
}

/* ==================== MANAGER VIEW ==================== */
async function renderManager() {
  app.innerHTML = loadingScreenHtml('Loading your station…');
  await loadRefData();
  state.expenseLines = [];
  state.deliveryLines = [];
  state.cashSalesLines = [];
  state.cardSalesLines = [];
  state.checkLines = [];

  app.innerHTML = `
    <div class="topbar">
      <div>
        <h1>${stationName(state.user.stationId)}</h1>
        <div class="who row" style="gap:8px;">
          ${state.user.photoBase64 ? `<img src="${state.user.photoBase64}" style="width:24px; height:24px; border-radius:50%; object-fit:cover;">` : ''}
          <span>${state.user.name} · ${state.user.employeeId}</span>
        </div>
      </div>
      <button class="btn secondary small" onclick="logout()">Log Out</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="entry" onclick="switchTab('entry')">New Shift Entry</div>
      <div class="tab" data-tab="utang" onclick="switchTab('utang')">Utang</div>
      <div class="tab" data-tab="fuel" onclick="switchTab('fuel')">Fuel Reading</div>
      <div class="tab" data-tab="custody" onclick="switchTab('custody')">Cash Custody</div>
      <div class="tab" data-tab="history" onclick="switchTab('history')">History</div>
    </div>

    <div id="tab-entry">${entryFormHtml()}</div>
    <div id="tab-utang" class="hidden"></div>
    <div id="tab-fuel" class="hidden"></div>
    <div id="tab-custody" class="hidden"></div>
    <div id="tab-history" class="hidden"></div>
  `;
  fillTodayReceivables();
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.getElementById('tab-entry').classList.toggle('hidden', name !== 'entry');
  document.getElementById('tab-utang').classList.toggle('hidden', name !== 'utang');
  document.getElementById('tab-fuel').classList.toggle('hidden', name !== 'fuel');
  document.getElementById('tab-custody').classList.toggle('hidden', name !== 'custody');
  document.getElementById('tab-history').classList.toggle('hidden', name !== 'history');
  if (name === 'history') loadManagerHistory();
  if (name === 'fuel') loadFuelTab();
  if (name === 'utang') loadUtangTab();
  if (name === 'custody') loadCustodyTab();
}

async function fillTodayReceivables() {
  const date = document.getElementById('shiftDate').value;
  const res = await api('getTodayReceivablesCollected', { stationId: state.user.stationId, date });
  document.getElementById('receivablesCollected').value = (res.total || 0).toFixed(2);
}

function entryFormHtml() {
  const today = new Date().toISOString().slice(0, 10);
  return `
    <div class="card">
      <h2 style="margin-top:0;">Shift Date</h2>
      <input type="date" id="shiftDate" value="${today}">
    </div>

    <div class="card">
      <h2 style="margin-top:0;">Cash In</h2>
      <label>Cash Sales</label>
      <div id="cashSalesLines"></div>
      <button class="btn secondary small" onclick="addSaleLine('cash')">+ Add Cash Sale Line</button>

      <label style="margin-top:18px;">Card / E-wallet Sales</label>
      <div id="cardSalesLines"></div>
      <button class="btn secondary small" onclick="addSaleLine('card')">+ Add Card/E-wallet Sale Line</button>

      <label style="margin-top:18px;">Check Payments Received (postdated OK)</label>
      <div id="checkLines"></div>
      <button class="btn secondary small" onclick="addCheckLine()">+ Add Check</button>
      <p class="muted" style="margin:6px 0 0;">Checks count toward revenue right away but are excluded from the physical cash count below — a check isn't cash in the drawer until it clears.</p>

      <label style="margin-top:18px;">Receivables Collected (auto from Utang payments today)</label>
      <input type="number" id="receivablesCollected" value="0" step="0.01" readonly style="background:var(--paper);">
    </div>

    <div class="card">
      <h2 style="margin-top:0;">Cash Out</h2>
      <label>Cash Deposited to Bank</label>
      <input type="number" id="cashDeposited" value="0" step="0.01">

      <label style="margin-top:18px;">Operating Expenses</label>
      <div id="expenseLines"></div>
      <button class="btn secondary small" onclick="addLine('Expense')">+ Add Expense Line</button>

      <label style="margin-top:18px;">Delivery / Supplier Payments</label>
      <div id="deliveryLines"></div>
      <button class="btn secondary small" onclick="addLine('Delivery')">+ Add Delivery Line</button>
    </div>

    <div class="card">
      <h2 style="margin-top:0;">Physical Cash Count (Drawer/Safe)</h2>
      <p class="muted">Count the actual cash left in the drawer/safe right now and enter it here — this should be ₱0 if everything was deposited, or the leftover amount if some cash is being held (e.g. bank closed).</p>
      <input type="number" id="actualBalance" value="0" step="0.01">
    </div>

    <button class="btn" onclick="reviewEntry()">Review Entry</button>
    <div id="reviewBox"></div>
  `;
}

const LINE_CONFIG = {
  Expense:  { arrayKey: 'expenseLines',   containerId: 'expenseLines',   catType: 'Expense'  },
  Delivery: { arrayKey: 'deliveryLines',  containerId: 'deliveryLines',  catType: 'Delivery' },
  cash:     { arrayKey: 'cashSalesLines', containerId: 'cashSalesLines', catType: 'Sale'     },
  card:     { arrayKey: 'cardSalesLines', containerId: 'cardSalesLines', catType: 'Sale'     }
};

function categoryOptions(catType) {
  return state.categories.filter(c => c.Type === catType)
    .map(c => `<option value="${c.Name}">${c.Name}</option>`).join('');
}

function addLine(type) {
  const cfg = LINE_CONFIG[type];
  state[cfg.arrayKey].push({ category: '', amount: 0 });
  renderLines(type);
}
function addSaleLine(type) { addLine(type); }

function renderLines(type) {
  const cfg = LINE_CONFIG[type];
  const arr = state[cfg.arrayKey];
  const container = document.getElementById(cfg.containerId);
  container.innerHTML = arr.map((line, i) => `
    <div class="line-item">
      <select onchange="updateLine('${type}', ${i}, 'category', this.value)">
        <option value="">Select category…</option>
        ${categoryOptions(cfg.catType)}
      </select>
      <input type="number" placeholder="Amount" step="0.01" value="${line.amount}"
        onchange="updateLine('${type}', ${i}, 'amount', this.value)">
      <button class="remove-line" onclick="removeLine('${type}', ${i})">✕</button>
    </div>
  `).join('');
  arr.forEach((line, i) => {
    const sel = container.children[i].querySelector('select');
    if (sel) sel.value = line.category;
  });
}

function updateLine(type, i, field, value) {
  const cfg = LINE_CONFIG[type];
  state[cfg.arrayKey][i][field] = field === 'amount' ? Number(value) : value;
}

function removeLine(type, i) {
  const cfg = LINE_CONFIG[type];
  state[cfg.arrayKey].splice(i, 1);
  renderLines(type);
}

/* ==================== Check lines (bespoke: more fields than category+amount) ==================== */
function addCheckLine() {
  state.checkLines.push({ payerName: '', amount: 0, checkNumber: '', bank: '', postDate: '', note: '' });
  renderCheckLines();
}

function renderCheckLines() {
  const container = document.getElementById('checkLines');
  const today = new Date().toISOString().slice(0,10);
  container.innerHTML = state.checkLines.map((line, i) => `
    <div class="card" style="background:var(--paper); margin-bottom:10px;">
      <div class="row between"><strong>Check #${i + 1}</strong>
        <button class="remove-line" onclick="removeCheckLine(${i})">✕</button></div>
      <div class="grid2">
        <div><label>Payer Name</label><input value="${line.payerName}" onchange="updateCheckLine(${i}, 'payerName', this.value)"></div>
        <div><label>Amount</label><input type="number" step="0.01" value="${line.amount}" onchange="updateCheckLine(${i}, 'amount', this.value)"></div>
        <div><label>Check Number</label><input value="${line.checkNumber}" onchange="updateCheckLine(${i}, 'checkNumber', this.value)"></div>
        <div><label>Bank</label><input value="${line.bank}" onchange="updateCheckLine(${i}, 'bank', this.value)"></div>
        <div><label>Post-Date (maturity)</label><input type="date" value="${line.postDate}" min="${today}" onchange="updateCheckLine(${i}, 'postDate', this.value)"></div>
      </div>
    </div>
  `).join('');
}

function updateCheckLine(i, field, value) {
  state.checkLines[i][field] = field === 'amount' ? Number(value) : value;
}

function removeCheckLine(i) {
  state.checkLines.splice(i, 1);
  renderCheckLines();
}

function currentEntryValues() {
  const num = id => Number(document.getElementById(id).value || 0);
  const cashSalesTotal = state.cashSalesLines.reduce((s, l) => s + Number(l.amount || 0), 0);
  const cardSalesTotal = state.cardSalesLines.reduce((s, l) => s + Number(l.amount || 0), 0);
  const checkTotal = state.checkLines.reduce((s, l) => s + Number(l.amount || 0), 0);
  const expenseTotal = state.expenseLines.reduce((s, l) => s + Number(l.amount || 0), 0);
  const deliveryTotal = state.deliveryLines.reduce((s, l) => s + Number(l.amount || 0), 0);
  // Total revenue (for display) includes card/e-wallet sales and checks.
  const moneyIn = cashSalesTotal + cardSalesTotal + checkTotal + num('receivablesCollected');
  const moneyOut = num('cashDeposited') + expenseTotal + deliveryTotal;
  // Expected PHYSICAL CASH excludes card sales AND checks — neither is cash
  // actually sitting in the drawer, so both stay out of the reconciliation.
  const cashMoneyIn = cashSalesTotal + num('receivablesCollected');
  const expected = cashMoneyIn - moneyOut;
  const actual = num('actualBalance');
  return { moneyIn, moneyOut, expected, actual, checkTotal, variance: actual - expected };
}

function reviewEntry() {
  const v = currentEntryValues();
  const matches = Math.abs(v.variance) < 0.01;
  document.getElementById('reviewBox').innerHTML = `
    <div class="review-box">
      <div class="review-row"><span>Total Revenue (cash + card + checks + receivables)</span><span class="num">${peso(v.moneyIn)}</span></div>

/* ==================== Success banner helper ==================== */
function showSuccessBanner(message) {
  const banner = document.createElement('div');
  banner.className = 'success-banner';
  banner.innerHTML = `<span>✓ ${message}</span>`;
  app.prepend(banner);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => banner.remove(), 4000);
}

async function confirmSubmit(matches) {
  const num = id => Number(document.getElementById(id).value || 0);
  let note = '';
  if (!matches) {
    note = document.getElementById('varianceNote').value.trim();
    if (!note) { alert('Please add a short reason for the variance before submitting.'); return; }
  }
  if (!confirm('Please confirm all data above is correct. Submit this shift entry?')) return;
  const payload = {
    stationId: state.user.stationId,
    employeeId: state.user.employeeId,
    shiftDate: document.getElementById('shiftDate').value,
    cashSalesLines: state.cashSalesLines,
    cardSalesLines: state.cardSalesLines,
    checkLines: state.checkLines,
    receivablesCollected: num('receivablesCollected'),
    cashDeposited: num('cashDeposited'),
    expenseLines: state.expenseLines,
    deliveryLines: state.deliveryLines,
    actualBalance: num('actualBalance'),
    note
  };
  const submitBtn = document.querySelector('#reviewBox .btn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Submitting…'; }
  const res = await api('submitEntry', payload);
  if (res.success) {
    await renderManager();
    showSuccessBanner('Shift entry submitted successfully. The form below is a fresh, blank entry.');
  } else {
    alert('Error: ' + res.error);
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Confirm & Submit'; }
  }
}

// Shared status badge: flagged (red), approved/resolved (green, different label), or OK.
function statusBadge(variance, resolvedStatus, tolerance) {
  const isFlagged = Math.abs(variance) > (tolerance || 0.01);
  if (isFlagged && resolvedStatus === 'Approved') return '<span class="badge ok">Approved</span>';
  if (isFlagged) return '<span class="badge flag">Flagged</span>';
  return '<span class="badge ok">OK</span>';
}

function historyTableHtml(entries) {
  if (!entries.length) return '<p class="muted">No entries yet.</p>';
  return `
    <table>
      <tr><th>Date</th><th>Cash In</th><th>Cash Out</th><th>Variance</th><th>Status</th></tr>
      ${entries.map(e => {
        const flagged = Math.abs(e.Variance) > 0.01 && e.ResolvedStatus !== 'Approved';
        return `<tr class="${flagged ? 'flagged' : ''}">
          <td>${formatDate(e.ShiftDate)}${submittedNote(e.ShiftDate, e.Timestamp)}</td>
          <td class="num">${peso(Number(e.CashSales) + Number(e.CardSales) + Number(e.ReceivablesCollected))}</td>
          <td class="num">${peso(Number(e.CashDeposited) + e.ExpenseLines.reduce((s,l)=>s+Number(l.amount||0),0) + e.DeliveryLines.reduce((s,l)=>s+Number(l.amount||0),0))}</td>
          <td class="num">${peso(e.Variance)}</td>
          <td>${statusBadge(e.Variance, e.ResolvedStatus)}</td>
        </tr>`;
      }).join('')}
    </table>
  `;
}

function fuelEntryValues() {
  const num = id => Number(document.getElementById(id).value || 0);
  const litersSold = num('pumpMeterClose') - num('pumpMeterOpen');
  const expectedClosingDip = num('openingDip') + num('fuelDelivered') - litersSold;
  const actualClosingDip = num('closingDip');
  return { litersSold, expectedClosingDip, actualClosingDip, variance: actualClosingDip - expectedClosingDip };
}

function liters(n) { return Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' L'; }

function reviewFuelEntry() {
  const v = fuelEntryValues();
  const matches = Math.abs(v.variance) < 0.001;
  document.getElementById('fuelReviewBox').innerHTML = `
    <div class="review-box">
      <div class="review-row"><span>Liters Sold (from meter)</span><span class="num">${liters(v.litersSold)}</span></div>
      <div class="review-row total"><span>Expected Closing Dip</span><span class="num">${liters(v.expectedClosingDip)}</span></div>
      <div class="review-row"><span>Actual Closing Dip</span><span class="num">${liters(v.actualClosingDip)}</span></div>
      <div class="review-row total">
        <span>${matches ? 'Matches' : 'Variance'}</span>
        <span class="num ${matches ? 'match' : 'mismatch'}">${matches ? '✓ Matches' : liters(v.variance)}</span>
      </div>
      ${!matches ? `
        <label>Reason for variance (required)</label>
        <input id="fuelVarianceNote" placeholder="e.g. meter reset, pump not dispensing, spillage">
      ` : ''}
      <button class="btn" style="width:100%; margin-top:14px;" onclick="confirmFuelSubmit(${matches})">Confirm & Submit</button>
    </div>
  `;
}

async function confirmFuelSubmit(matches) {

  const payload = {
    stationId: state.user.stationId,
    fuelTypeId: document.getElementById('fuelTypeSelect').value,
    employeeId: state.user.employeeId,
    readingDate: document.getElementById('fuelReadingDate').value,
    openingDip: num('openingDip'),
    closingDip: num('closingDip'),
    fuelDelivered: num('fuelDelivered'),
    pumpMeterOpen: num('pumpMeterOpen'),
    pumpMeterClose: num('pumpMeterClose'),
    note
  };
  const res = await api('submitFuelEntry', payload);
  if (res.success) {
    await loadFuelTab();
    showSuccessBanner('Fuel reading submitted successfully.');
  } else {
    alert('Error: ' + res.error);
  }
}

async function generateReport() {
  const stationId = document.getElementById('reportStation').value;
  const detail = document.getElementById('reportDetail').value;
  const dateFrom = document.getElementById('reportFrom').value;
  const dateTo = document.getElementById('reportTo').value;

  const out = document.getElementById('reportOutput');
  out.innerHTML = '<p class="muted">Generating…</p>';
  const res = await api('getReportData', { stationId, dateFrom, dateTo });
  lastReportData = res;

  const cashInTotal = res.cash.reduce((s,e) => s + Number(e.CashSales||0) + Number(e.CardSales||0) + Number(e.ReceivablesCollected||0), 0);
  const cashOutTotal = res.cash.reduce((s,e) => s + Number(e.CashDeposited||0) + e.ExpenseLines.reduce((a,l)=>a+Number(l.amount||0),0) + e.DeliveryLines.reduce((a,l)=>a+Number(l.amount||0),0), 0);
  const varianceTotal = res.cash.reduce((s,e) => s + Number(e.Variance||0), 0);
  const fuelSoldTotal = res.fuel.reduce((s,e) => s + Number(e.LitersSold||0), 0);
  const fuelDeliveredTotal = res.fuel.reduce((s,e) => s + Number(e.FuelDelivered||0), 0);
  const fuelVarianceTotal = res.fuel.reduce((s,e) => s + Number(e.Variance||0), 0);
  const receivablesTotal = res.receivables.reduce((s,c) => s + Number(c.balance||0), 0);

  const stationLabel = stationId === 'all' ? 'All Stations' : stationName(stationId);

  let html = `
    <div id="printableReport">
      <div style="text-align:center; margin-bottom:20px;">
        <img src="logo.png" style="max-width:160px;">
        <h1 style="margin:8px 0 0;">9th Fuel Hub Corporation</h1>
        <p class="muted">${stationLabel} — ${dateFrom} to ${dateTo} (${detail === 'summary' ? 'Summary' : 'Detailed'})</p>
        <p class="muted">Generated ${new Date().toLocaleString()}</p>
      </div>

      <h2>Cash Summary</h2>
      <table>
        <tr><th>Total Cash+Card In</th><th>Total Cash Out</th><th>Net Variance</th></tr>
        <tr><td class="num">${peso(cashInTotal)}</td><td class="num">${peso(cashOutTotal)}</td><td class="num">${peso(varianceTotal)}</td></tr>
      </table>

      <h2>Fuel Summary</h2>
      <table>
        <tr><th>Delivered</th><th>Sold</th><th>Variance</th></tr>
        <tr><td class="num">${liters(fuelDeliveredTotal)}</td><td class="num">${liters(fuelSoldTotal)}</td><td class="num">${liters(fuelVarianceTotal)}</td></tr>
      </table>

      <h2>Receivables Summary</h2>
      <table>
        <tr><th>Total Outstanding</th><th>Customers with Balance</th></tr>
        <tr><td class="num">${peso(receivablesTotal)}</td><td>${res.receivables.length}</td></tr>
      </table>
  `;

  if (detail === 'detailed') {
    html += `
      <h2>Cash — Shift Detail</h2>
      <table>
        <tr><th>Date</th><th>Station</th><th>Cash In</th><th>Card In</th><th>Out</th><th>Variance</th></tr>
        ${res.cash.map(e => `<tr><td>${formatDate(e.ShiftDate)}${submittedNote(e.ShiftDate, e.Timestamp)}</td><td>${stationName(e.StationID)}</td>
          <td class="num">${peso(e.CashSales)}</td><td class="num">${peso(e.CardSales)}</td>
          <td class="num">${peso(Number(e.CashDeposited)+e.ExpenseLines.reduce((a,l)=>a+Number(l.amount||0),0)+e.DeliveryLines.reduce((a,l)=>a+Number(l.amount||0),0))}</td>
          <td class="num">${peso(e.Variance)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No entries.</td></tr>'}
      </table>

      <h2>Fuel — Reading Detail</h2>
      <table>
        <tr><th>Date</th><th>Station</th><th>Delivered</th><th>Sold</th><th>Variance</th></tr>
        ${res.fuel.map(e => `<tr><td>${formatDate(e.ReadingDate)}${submittedNote(e.ReadingDate, e.Timestamp)}</td><td>${stationName(e.StationID)}</td>
          <td class="num">${liters(e.FuelDelivered)}</td><td class="num">${liters(e.LitersSold)}</td>
          <td class="num">${liters(e.Variance)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No entries.</td></tr>'}
      </table>

      <h2>Receivables — Customer Detail</h2>
      <table>
        <tr><th>Customer</th><th>Balance</th><th>Days Outstanding</th></tr>
        ${res.receivables.map(c => `<tr><td>${c.name}</td><td class="num">${peso(c.balance)}</td><td>${c.daysOutstanding}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">None.</td></tr>'}
      </table>
    `;
  }

  html += `</div>
    <button class="btn no-print" style="margin-top:16px;" onclick="window.print()">Print / Save as PDF</button>
  `;

  out.innerHTML = html;
}

let lastHistoryEntries = [];

async function applyHistoryFilter() {
  const stationId = document.getElementById('filterStation').value;
  const dateFrom = document.getElementById('filterFrom').value;
  const dateTo = document.getElementById('filterTo').value;
  const res = await api('getHistory', { stationId, dateFrom, dateTo });
  lastHistoryEntries = res.entries || [];
  document.getElementById('ownerHistoryTable').innerHTML = `
    <table>
      <tr><th>Date</th><th>Station</th><th>Cash In</th><th>Cash Out</th><th>Variance</th><th>Status</th></tr>
      ${lastHistoryEntries.map(e => {
        const flagged = Math.abs(e.Variance) > 0.01 && e.ResolvedStatus !== 'Approved';
        const out = Number(e.CashDeposited) + e.ExpenseLines.reduce((s,l)=>s+Number(l.amount||0),0) + e.DeliveryLines.reduce((s,l)=>s+Number(l.amount||0),0);
        return `<tr class="${flagged?'flagged':''}">
          <td>${formatDate(e.ShiftDate)}${submittedNote(e.ShiftDate, e.Timestamp)}</td>
          <td>${stationName(e.StationID)}</td>
          <td class="num">${peso(Number(e.CashSales)+Number(e.CardSales)+Number(e.ReceivablesCollected))}</td>
          <td class="num">${peso(out)}</td>
          <td class="num">${peso(e.Variance)}</td>
          <td>${statusBadge(e.Variance, e.ResolvedStatus)}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="6" class="muted">No entries found.</td></tr>'}
    </table>
  `;
}

function exportHistoryCsv() {
  const rows = [['Date','Station','EmployeeID','CashSales','CardSales','ReceivablesCollected','CashDeposited','Variance','Note']];
  lastHistoryEntries.forEach(e => rows.push([e.ShiftDate, stationName(e.StationID), e.EmployeeID, e.CashSales, e.CardSales, e.ReceivablesCollected, e.CashDeposited, e.Variance, (e.Note||'').replace(/,/g,';')]));
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'station_history.csv';
  a.click();
}

function toggleNewUserStationField() {
  const role = document.getElementById('newRole').value;
  document.getElementById('newStationWrap').classList.toggle('hidden', role !== 'manager');
}

async function submitAddManager() {
  const employeeId = document.getElementById('newEmpId').value.trim();
  const pin = document.getElementById('newPin').value.trim();
  const name = document.getElementById('newName').value.trim();
  const role = document.getElementById('newRole').value;
  const stationId = role === 'manager' ? document.getElementById('newStation').value : '';
  if (!employeeId || !pin || !name) { alert('Fill in all fields.'); return; }
  await api('addManager', { employeeId, pin, name, stationId, role });
  await loadOwnerManagers();
  showSuccessBanner('User added successfully.');
}

async function removeManagerConfirm(employeeId) {
  if (!confirm('Remove this user?')) return;
  await api('removeManager', { employeeId });
  await loadOwnerManagers();
  showSuccessBanner('User removed.');
}

async function promptResetPin(employeeId) {
  const newPin = prompt('Enter new 6-digit PIN for ' + employeeId);
  if (!newPin) return;
  await api('resetPin', { employeeId, newPin });
  showSuccessBanner('PIN updated successfully for ' + employeeId + '.');
}

async function loadOwnerCategories() {
  const box = document.getElementById('owner-categories');
  const saleCats = state.categories.filter(c => c.Type === 'Sale');
  const expenseCats = state.categories.filter(c => c.Type === 'Expense');
  const deliveryCats = state.categories.filter(c => c.Type === 'Delivery');
  box.innerHTML = `
    <div class="grid2">
      <div class="card">
        <h2 style="margin-top:0;">Sale Categories (Cash & Card)</h2>
        ${saleCats.map(c => `
          <div class="row between" style="padding:6px 0; border-bottom:1px solid var(--line);">
            <span>${c.Name}</span>
            <button class="btn danger small" onclick="removeCategoryConfirm('${c.CategoryID}')">Remove</button>
          </div>`).join('')}
        <div class="row" style="margin-top:12px;">
          <input id="newSaleCat" placeholder="New category name">
          <button class="btn small" onclick="submitAddCategory('Sale')">Add</button>
        </div>
      </div>
      <div class="card">
        <h2 style="margin-top:0;">Expense Categories</h2>
        ${expenseCats.map(c => `
          <div class="row between" style="padding:6px 0; border-bottom:1px solid var(--line);">
            <span>${c.Name}</span>
            <button class="btn danger small" onclick="removeCategoryConfirm('${c.CategoryID}')">Remove</button>
          </div>`).join('')}
        <div class="row" style="margin-top:12px;">
          <input id="newExpenseCat" placeholder="New category name">
          <button class="btn small" onclick="submitAddCategory('Expense')">Add</button>
        </div>
      </div>
      <div class="card">
        <h2 style="margin-top:0;">Delivery Categories</h2>
        ${deliveryCats.map(c => `
          <div class="row between" style="padding:6px 0; border-bottom:1px solid var(--line);">
            <span>${c.Name}</span>
            <button class="btn danger small" onclick="removeCategoryConfirm('${c.CategoryID}')">Remove</button>
          </div>`).join('')}
        <div class="row" style="margin-top:12px;">
          <input id="newDeliveryCat" placeholder="New category name">
          <button class="btn small" onclick="submitAddCategory('Delivery')">Add</button>
        </div>
      </div>
    </div>
  `;
}

async function submitAddCategory(type) {
  const idMap = { Sale: 'newSaleCat', Expense: 'newExpenseCat', Delivery: 'newDeliveryCat' };
  const name = document.getElementById(idMap[type]).value.trim();
  if (!name) return;
  await api('addCategory', { type, name });
  await loadRefData();
  loadOwnerCategories();
  showSuccessBanner('Category added successfully.');
}

async function removeCategoryConfirm(categoryId) {
  if (!confirm('Remove this category? Past entries keep it, but it won\'t show for new entries.')) return;
  await api('removeCategory', { categoryId });
  await loadRefData();
  loadOwnerCategories();
  showSuccessBanner('Category removed.');
}

/* ==================== Boot ==================== */
render();

// Register the service worker so "Add to Home Screen" installs as a real,
// standalone app instead of just a browser bookmark shortcut.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // Fails silently — the app still works fine as a normal web page,
      // it just won't offer the "install" experience.
    });
  });
}
</script>
